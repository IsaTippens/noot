<!DOCTYPE html>
<html>

<head>
    <title>Noot Noot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@600&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            justify-content: center;
            align-content: center;
            overflow: hidden;
        }

        p,
        a {
            color: #1f1f1f;
            font-size: large;
            font-family: 'Source Sans Pro', sans-serif;
        }

        a {
            color: cornflowerblue;
        }

        img {
            display: block;
            margin: auto;
        }

        .box {

            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100%;
        }

        .noot {
            margin: auto;
        }

        /* Portals to other projects, arranged around the gif */
        .stage {
            position: relative;
            margin-top: 200px;
        }

        .portal {
            --size: 140px;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .portal-left {
            right: calc(100% + 48px);
            top: 50%;
            transform: translateY(-50%);
        }

        .portal-top {
            bottom: calc(100% + 28px);
            left: 50%;
            transform: translateX(-50%);
        }

        .portal-right {
            left: calc(100% + 48px);
            top: 50%;
            transform: translateY(-50%);
        }

        .portal-window {
            position: relative;
            display: block;
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            isolation: isolate;
            transition: transform 0.35s ease;
        }

        /* Swirling ring */
        .portal-window::before {
            content: "";
            position: absolute;
            inset: -7px;
            z-index: -1;
            border-radius: 50%;
            background: conic-gradient(var(--c1), var(--c2), var(--c1), var(--c2), var(--c1));
            box-shadow: 0 0 22px 2px var(--c1);
            animation: portal-spin 4s linear infinite;
        }

        /* Depth vignette */
        .portal-window::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 26px 8px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .portal-window img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .portal:hover .portal-window,
        .portal:focus-visible .portal-window {
            transform: scale(1.08);
        }

        .portal:hover .portal-window::before,
        .portal:focus-visible .portal-window::before {
            animation-duration: 1.2s;
        }

        .portal-quantum {
            --c1: #8b5cf6;
            --c2: #22d3ee;
        }

        .portal-horizon {
            --c1: #f59e0b;
            --c2: #1e3a8a;
        }

        .portal-blog {
            --c1: #22c55e;
            --c2: #0a0a0a;
        }

        @keyframes portal-spin {
            to {
                transform: rotate(1turn);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .portal-window::before {
                animation: none;
            }
        }

        /* Not enough room to surround the gif: line portals up below it */
        @media (max-width: 900px),
        (max-height: 620px) {
            .stage {
                margin-top: 0;
                display: grid;
                grid-template-columns: repeat(3, auto);
                justify-content: center;
                gap: 20px 28px;
            }

            .stage>img {
                grid-column: 1 / -1;
                max-width: 100%;
                height: auto;
            }

            .portal {
                --size: 84px;
                position: static;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <!--
        Stinky haha
    -->
    <div class="box">
        <div class="noot">
            <div class="stage">
                <img src="pengu.gif" alt="My GIF">
                <a class="portal portal-left portal-quantum" href="https://quantum.isatippens.com" title="QuantumLab">
                    <span class="portal-window"><img src="portals/quantum.jpg" alt="" width="320" height="320"></span>
                    <span class="portal-label">quantum</span>
                </a>
                <a class="portal portal-top portal-horizon" href="https://horizon.noot.zip" title="Fifty Years Beyond Earth">
                    <span class="portal-window"><img src="portals/horizon.jpg" alt="" width="320" height="320"></span>
                    <span class="portal-label">horizon</span>
                </a>
                <a class="portal portal-right portal-blog" href="https://blog.noot.zip" title="TECH_LOG // SYSTEM_OUT">
                    <span class="portal-window"><img src="portals/blog.jpg" alt="" width="320" height="320"></span>
                    <span class="portal-label">blog</span>
                </a>
            </div>
            <p>Made by <a href="https://isatippens.com">me</a></p>
        </div>
    </div>
</body>

</html>
