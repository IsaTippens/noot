<!DOCTYPE html>
<html>

<head>
    <title>Noot Noot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@600&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            justify-content: center;
            align-content: center;
            overflow: hidden;
        }

        p,
        a {
            color: #1f1f1f;
            font-size: large;
            font-family: 'Source Sans Pro', sans-serif;
        }

        a {
            color: cornflowerblue;
        }

        img {
            display: block;
            margin: auto;
        }

        .box {

            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100%;
        }

        .noot {
            margin: auto;
        }

        /* Bento grid of other projects, wrapped around the gif */
        .bento {
            display: grid;
            grid-template-columns: 240px 500px 240px;
            grid-template-rows: 180px auto;
            grid-template-areas:
                "horizon horizon quantum"
                "blog    center  quantum";
            gap: 12px;
        }

        .center {
            grid-area: center;
        }

        .tile {
            position: relative;
            overflow: hidden;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .tile:hover,
        .tile:focus-visible {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
        }

        .tile:hover img,
        .tile:focus-visible img {
            transform: scale(1.04);
        }

        .tile-label {
            position: absolute;
            left: 10px;
            bottom: 10px;
            padding: 2px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: #1f1f1f;
            font-size: medium;
            border: 1px solid #e5e5e5;
        }

        .tile-horizon {
            grid-area: horizon;
        }

        .tile-horizon img {
            object-position: center 22%;
        }

        .tile-quantum {
            grid-area: quantum;
        }

        .tile-quantum img {
            object-position: 4% center;
        }

        .tile-blog {
            grid-area: blog;
        }

        .tile-blog img {
            object-position: 14% center;
        }

        /* Not enough room to wrap the gif: gif on top, tiles in a row below */
        @media (max-width: 1040px),
        (max-height: 640px) {
            .bento {
                width: min(500px, 100%);
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: auto 110px;
                grid-template-areas:
                    "center  center  center"
                    "horizon quantum blog";
            }

            .center img {
                max-width: 100%;
                height: auto;
            }

            .tile-label {
                left: 6px;
                bottom: 6px;
                padding: 0 8px;
                font-size: small;
            }
        }
    </style>
</head>

<body>
    <!--
        Stinky haha
    -->
    <div class="box">
        <div class="noot">
            <div class="bento">
                <div class="center">
                    <img src="pengu.gif" alt="My GIF">
                    <p>Made by <a href="https://isatippens.com">me</a></p>
                </div>
                <a class="tile tile-horizon" href="https://horizon.noot.zip" title="Fifty Years Beyond Earth">
                    <img src="sites/horizon.jpg" alt="" width="1280" height="800">
                    <span class="tile-label">horizon</span>
                </a>
                <a class="tile tile-quantum" href="https://quantum.isatippens.com" title="QuantumLab">
                    <img src="sites/quantum.jpg" alt="" width="1280" height="800">
                    <span class="tile-label">quantum</span>
                </a>
                <a class="tile tile-blog" href="https://blog.noot.zip" title="TECH_LOG // SYSTEM_OUT">
                    <img src="sites/blog.jpg" alt="" width="1280" height="800">
                    <span class="tile-label">blog</span>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
